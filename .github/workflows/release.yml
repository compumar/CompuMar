name: CompuMar Core Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          pkg-config \
          libssl-dev \
          libzmq3-dev \
          libunbound-dev \
          libsodium-dev \
          libunwind8-dev \
          liblzma-dev \
          libreadline-dev \
          libhidapi-dev \
          libusb-1.0-0-dev \
          libboost-system-dev \
          libboost-filesystem-dev \
          libboost-thread-dev \
          libboost-date-time-dev \
          libboost-chrono-dev \
          libboost-regex-dev \
          libboost-serialization-dev \
          libboost-program-options-dev \
          libboost-locale-dev

    - name: Fix Linux Case Sensitivity
      run: |
        echo "Corrigiendo diferencias de mayúsculas/minúsculas entre Windows y Linux..."
        FILE_PATH=$(find . -type f -iname "cryptonightr_jit.c" | head -n 1)
        if [ -n "$FILE_PATH" ]; then
          echo "Archivo encontrado en: $FILE_PATH"
          cp "$FILE_PATH" src/crypto/CryptonightR_JIT.c
        else
          echo "Creando archivo temporal..."
          mkdir -p src/crypto
          touch src/crypto/CryptonightR_JIT.c
        fi

    - name: Fix GCC 13+ missing includes
      run: |
        echo "Inyectando dependencias faltantes para compatibilidad con GCC 13..."
        sed -i '1i #include <deque>' src/common/threadpool.h
        sed -i '1i #include <deque>' src/common/dns_utils.cpp
        sed -i '1i #include <boost/mpl/contains.hpp>' contrib/epee/include/serialization/keyvalue_serialization_overloads.h

    - name: Build core
      run: |
        mkdir -p build
        cd build
        cmake -D CMAKE_BUILD_TYPE=Release ..
        make -j$(nproc)

    - name: Package binaries
      run: |
        mkdir -p release_pkg
        find build/src -maxdepth 1 -type f -executable -exec cp {} release_pkg/ \;
        tar -czvf compumar-core-linux-x64.tar.gz -C release_pkg .

    - name: Upload Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: compumar-core-linux-x64.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
