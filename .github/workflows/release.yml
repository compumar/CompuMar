name: CompuMar Core Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          pkg-config \
          libssl-dev \
          libzmq3-dev \
          libunbound-dev \
          libsodium-dev \
          libunwind8-dev \
          liblzma-dev \
          libreadline-dev \
          libhidapi-dev \
          libusb-1.0-0-dev \
          libboost-system-dev \
          libboost-filesystem-dev \
          libboost-thread-dev \
          libboost-date-time-dev \
          libboost-chrono-dev \
          libboost-regex-dev \
          libboost-serialization-dev \
          libboost-program-options-dev \
          libboost-locale-dev

    - name: Fix/Link CryptonightR_JIT.c
      run: |
        if [ ! -f src/crypto/CryptonightR_JIT.c ]; then
          echo "Buscando CryptonightR_JIT.c en submódulos..."
          TARGET=$(find external -name "CryptonightR_JIT.c" | head -n 1)
          if [ -n "$TARGET" ]; then
            echo "Encontrado en: $TARGET. Creando enlace simbólico..."
            ln -sf ../../$TARGET src/crypto/CryptonightR_JIT.c
          else
            echo "Advertencia: No se encontró el archivo en external/"
          fi
        fi

    - name: Build core
      run: |
        mkdir build
        cd build
        cmake -D CMAKE_BUILD_TYPE=Release ..
        make -j$(nproc)

    - name: Package binaries
      run: |
        mkdir -p release_pkg
        find build/src -maxdepth 1 -type f -executable -exec cp {} release_pkg/ \;
        tar -czvf compumar-core-linux-x64.tar.gz -C release_pkg .

    - name: Upload Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: compumar-core-linux-x64.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
