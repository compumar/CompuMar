name: CompuMar Core Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          pkg-config \
          libssl-dev \
          libzmq3-dev \
          libunbound-dev \
          libsodium-dev \
          libunwind8-dev \
          liblzma-dev \
          libreadline-dev \
          libhidapi-dev \
          libusb-1.0-0-dev \
          libboost-system-dev \
          libboost-filesystem-dev \
          libboost-thread-dev \
          libboost-date-time-dev \
          libboost-chrono-dev \
          libboost-regex-dev \
          libboost-serialization-dev \
          libboost-program-options-dev \
          libboost-locale-dev

    - name: Build project
      run: |
        mkdir build
        cd build
        cmake -D CMAKE_BUILD_TYPE=Release ..
        make -j$(nproc)

    - name: Package binaries
      run: |
        mkdir -p release_package
        find build/src -maxdepth 1 -type f -executable -exec cp {} release_package/ \;
        tar -czvf compumar-core-linux-x64.tar.gz -C release_package .

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: compumar-core-linux-x64.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
