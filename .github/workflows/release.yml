name: CompuMar Core Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    container: ubuntu:20.04

    steps:
    - name: Pre-install Git & Fix Permissions
      run: |
        apt-get update
        apt-get install -y git ca-certificates
        git config --global --add safe.directory '*'

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Force Submodules fix for Docker
      run: |
        git config --global --add safe.directory '*'
        git submodule update --init --force --recursive

    - name: Install dependencies
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        apt-get install -y \
          build-essential \
          cmake \
          pkg-config \
          libssl-dev \
          libzmq3-dev \
          libunbound-dev \
          libsodium-dev \
          libunwind8-dev \
          liblzma-dev \
          libreadline-dev \
          libhidapi-dev \
          libusb-1.0-0-dev \
          libboost-all-dev \
          tar \
          tzdata

    - name: Fix Linux Case Sensitivity
      run: |
        FILE_PATH=$(find . -type f -iname "cryptonightr_jit.c" | head -n 1)
        if [ -n "$FILE_PATH" ]; then
          cp "$FILE_PATH" src/crypto/CryptonightR_JIT.c || true
        else
          mkdir -p src/crypto
          touch src/crypto/CryptonightR_JIT.c
        fi

    - name: Build core
      run: |
        mkdir -p build
        cd build
        cmake -D CMAKE_BUILD_TYPE=Release -D MANUAL_SUBMODULES=1 ..
        make -j$(nproc)

    - name: Package binaries
      run: |
        mkdir -p release_pkg
        find build/src -maxdepth 1 -type f -executable -exec cp {} release_pkg/ \;
        tar -czvf compumar-core-linux-x64.tar.gz -C release_pkg .

    - name: Upload Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: compumar-core-linux-x64.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
